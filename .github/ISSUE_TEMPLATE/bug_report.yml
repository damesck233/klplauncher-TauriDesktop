name: Bug report
description: A crash, a failed install, or something behaving incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Before you paste a log**: game logs and crash reports usually
        contain your home directory name (for example `C:\Users\YourName\…`), and
        `accounts.json` or an API key must never be pasted at all. Please redact that sort of
        thing first — issues are public.

        中文用户可以直接用中文填写。

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I have read the [FAQ](https://klp-launcher.com/en/#faq) and did not find an answer
          required: true
        - label: I am using a copy of Minecraft I legitimately own, and this is not related to cracked clients or pirated content
          required: true
        - label: The logs I am pasting contain no account tokens, API keys or personal information I would not want public
          required: true

  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Shown under Settings → About
      placeholder: "0.1.100"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: datamode
    attributes:
      label: Data mode
      description: Settings → General states which mode is active and why
      options:
        - Portable
        - Installed
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong
      description: What you were trying to do, and what actually happened
      placeholder: |
        Trying to: install Sodium into "Kitchen Sink 1.20.1"
        What happened: the task sat at 0% in the task centre for ten minutes and never moved
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step by step — we should hit the same problem by following them
      placeholder: |
        1. Open Downloads → Mods
        2. Search for Sodium, pick 0.6.0
        3. Click install, choose the instance "Kitchen Sink 1.20.1"
        4. Open the task centre — the task is stuck at 0%
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen
      options:
        - Every time
        - Intermittently
        - Only saw it once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: |
        Launcher logs are under `logs/` in the data directory; game crash reports are under
        `crash-reports/` in the instance directory.
        **Redact usernames, tokens and API keys first.** If it is very long, paste the
        relevant few dozen lines or attach a file.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, GPU model, memory size, whether you had just updated, which mods are installed — anything you think is relevant
