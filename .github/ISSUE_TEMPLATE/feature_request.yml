name: Feature request
description: Something you would like the launcher to do, or to do differently
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describing **the problem you are trying to solve** is usually more useful than
        describing the feature you have in mind — the same problem often has a better
        solution than the first one that comes to mind.

        中文用户可以直接用中文填写。

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: This is not related to cracked clients, distributing pirated content, or bypassing authentication
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into
      description: How do you work around it today? How often does it come up?
      placeholder: |
        I have a dozen instances and finding the one I played last week means scrolling the
        whole list. Right now I prefix instance names with numbers just to keep them ordered.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do
      description: Write it down if you have something specific in mind — leaving this empty is fine, the section above matters more
      placeholder: Sort the instance list by "last played", or let a few instances be pinned.

  - type: textarea
    id: alternatives
    attributes:
      label: How do other launchers handle it
      description: If you have seen something similar elsewhere, say what it is called, what works well, and what is awkward about it

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, sketches, use cases
