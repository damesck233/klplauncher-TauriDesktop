name: 功能建议
description: 希望启动器多做一件事，或者把某件事做得不一样
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说清楚**你想解决的问题**通常比说清楚**你想要的功能**更有用——
        同一个问题往往有比第一反应更好的解法。

  - type: checkboxes
    id: preflight
    attributes:
      label: 发之前先确认
      options:
        - label: 我搜过现有的 Issue，没有重复
          required: true
        - label: 这个建议与破解、盗版资源分发、绕过正版验证无关
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题是什么
      description: 现在你是怎么应付它的？多久碰到一次？
      placeholder: |
        我有十几个实例，每次找上周玩的那个都要从头翻列表。
        现在只能靠给实例改名加数字前缀来排序。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么做
      description: 有具体想法就写，没有也可以留空——上面那段才是最重要的
      placeholder: 实例列表能按「最近游玩」排序，或者能置顶几个常用的。

  - type: textarea
    id: alternatives
    attributes:
      label: 别的启动器是怎么做的
      description: 如果你在其它启动器上见过类似的做法，说一下叫什么、好用在哪、哪里别扭

  - type: textarea
    id: extra
    attributes:
      label: 其它信息
      description: 截图、草图、使用场景都可以
